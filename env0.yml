# env0 custom flow (v2) — TEMPORARY DIAGNOSTIC (single valid hook).
#
# env0's schema validator confirmed it DOES read this file ("Deploy Spec was found in template
# folder. Validating..."), and that it is strict/fail-closed: setupVariables is `after`-only, and any
# invalid property rejects the whole file (which is why earlier probes silently did nothing). So we
# keep exactly ONE hook that the docs show supports `before`: terraformInit.before.
#
# This prints the runner's OS/libc + install tools so we can pick the right AWS CLI install method
# (the glibc v2 installer failed "cannot execute" -> likely musl/Alpine). Informational (exits 0); the
# run will still fail later at "aws not found" until the real install step replaces this.
#
# NOTE: `run` is a single line (commands joined with ';') to avoid YAML block-scalar pitfalls.
version: 2
shell: bash

deploy:
  steps:
    terraformInit:
      before:
        - name: Probe runner environment
          run: 'echo PROBE-HOOK-FIRED:terraformInit.before; echo "--- os-release ---"; cat /etc/os-release 2>&1 || true; echo "--- ldd ---"; ldd --version 2>&1 | head -3 || true; echo "--- id/HOME ---"; id; echo "HOME=$HOME"; echo "--- tools ---"; for t in apk apt-get yum dnf pip3 python3 curl unzip aws aws-iam-authenticator; do command -v "$t" >/dev/null 2>&1 && echo "FOUND $t" || echo "absent $t"; done; echo "--- done ---"'
