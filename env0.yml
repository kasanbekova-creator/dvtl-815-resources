# env0 custom flow (v2) — TEMPORARY MULTI-HOOK DIAGNOSTIC.
#
# Goal: find which lifecycle hook env0 actually runs for THIS OpenTofu template, and print the
# runner's OS/libc + install tools so we can pick the right AWS CLI install method. A prior probe
# under terraformInit.before produced NO log output even though the file is valid, at repo root,
# pushed, and the project policy is Merge — so we fan a tiny probe across three early hooks. Whichever
# "PROBE-HOOK-FIRED" line prints tells us the correct step key; if none print, the custom flow isn't
# being applied to this template (env0-side config, not this file). All steps exit 0 (informational);
# the run will still fail later at "aws not found" until we add the real install step.
#
# NOTE: every `run` is a single line (commands joined with ';') to avoid YAML block-scalar pitfalls.
version: 2
shell: bash

deploy:
  steps:
    setupVariables:
      before:
        - name: PROBE setupVariables.before
          run: 'echo PROBE-HOOK-FIRED:setupVariables.before'
    terraformInit:
      before:
        - name: PROBE terraformInit.before plus env details
          run: 'echo PROBE-HOOK-FIRED:terraformInit.before; echo "--- os-release ---"; cat /etc/os-release 2>&1 || true; echo "--- ldd ---"; ldd --version 2>&1 | head -3 || true; echo "--- id/HOME ---"; id; echo "HOME=$HOME"; echo "--- tools ---"; for t in apk apt-get yum dnf pip3 python3 curl unzip aws aws-iam-authenticator; do command -v "$t" >/dev/null 2>&1 && echo "FOUND $t" || echo "absent $t"; done; echo "--- done ---"'
    terraformPlan:
      before:
        - name: PROBE terraformPlan.before
          run: 'echo PROBE-HOOK-FIRED:terraformPlan.before'
