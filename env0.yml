# env0 custom flow (v2). Installs AWS CLI v2 on the runner BEFORE `tofu init`, because
# providers.tf authenticates the kubernetes/helm providers to EKS via exec auth
# (`aws eks get-token`), and the aws_eks_cluster data source + provider config resolve
# during plan. The env0 runner image does not ship the aws CLI (unlike aws-poc's CodeBuild
# image), so without this step every k8s/helm apply fails "exec: executable aws not found".
version: 2
shell: bash

deploy:
  steps:
    terraformInit:
      before:
        # TEMPORARY DIAGNOSTIC — prints the runner's OS/libc + available install tools so we can pick
        # the right AWS CLI install method. The official v2 installer failed with
        # "cannot execute: required file not found", which points to a musl/Alpine runner (the v2
        # binary is glibc-only). This step is informational (exits 0) and will be replaced by the
        # real install once we see the output. The run will still fail later at "aws not found".
        - name: Probe runner environment
          run: |
            echo "===== /etc/os-release ====="
            cat /etc/os-release 2>&1 || echo "(no /etc/os-release)"
            echo "===== libc (ldd) ====="
            ldd --version 2>&1 | head -3 || echo "(ldd not available)"
            echo "===== whoami / HOME ====="
            id 2>&1; echo "HOME=$HOME"
            echo "===== available install tools ====="
            for t in apk apt-get yum dnf pip pip3 python3 curl unzip aws aws-iam-authenticator; do
              if command -v "$t" >/dev/null 2>&1; then
                echo "FOUND  $t -> $(command -v "$t")"
              else
                echo "absent $t"
              fi
            done
            echo "===== done (informational) ====="
